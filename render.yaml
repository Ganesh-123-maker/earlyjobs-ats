# EarlyJobs Mini ATS — deployed on Render free tier
services:
  - type: web
    name: mini-ats
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false # set the Neon connection string in the Render dashboard
      # On first boot the app creates the schema and auto-seeds demo data
      # when the candidates table is empty (boot guard in server.js).
